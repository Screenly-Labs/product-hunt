---
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # The build re-fetches the Product Hunt feed each run, so a scheduled deploy is
  # how the featured set stays current — Product Hunt's day rolls over at 00:01
  # Pacific, and the set shifts through the day as products are featured.
  schedule:
    - cron: '17 */3 * * *' # every 3 hours (offset off the hour to be a good citizen)
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages and mint the OIDC token it needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck (tsc)
        run: bun run typecheck
      - name: Lint (Biome)
        run: bun run lint
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
